/* ponytail: 主题仅调色（换书换 CSS 变量）；若换书需要不同版式，再抽 layout 配置。 */
function applyTheme(t) {
  const s = document.documentElement.style;
  s.setProperty("--bg", t.bg);
  s.setProperty("--bg-soft", t.bgSoft);
  s.setProperty("--surface", t.surface);
  s.setProperty("--ink", t.ink);
  s.setProperty("--muted", t.muted);
  s.setProperty("--accent", t.accent);
  s.setProperty("--accent-2", t.accent2);
}

function renderBook(i) {
  const b = BOOKS[i];
  applyTheme(b.theme);
  document.getElementById("app").innerHTML =
    heroHTML(b) + sellingHTML(b) + introHTML(b) + authorHTML(b) +
    glimpsesHTML(b) + timelineHTML(b) + praiseHTML(b) + fitHTML(b) + relatedHTML(b);
  document.title = "《" + b.title + "》— 书籍推荐 | 一册·荐书";
}

const bookSelect = document.getElementById("book-select");
BOOKS.forEach(function (bk, i) {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = bk.title;
  bookSelect.appendChild(opt);
});
bookSelect.addEventListener("change", function () {
  renderBook(Number(bookSelect.value));
  window.scrollTo({ top: 0, behavior: "smooth" });
});

renderBook(0);
