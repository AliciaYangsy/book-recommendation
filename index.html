  s.setProperty("--bg", t.bg);
  s.setProperty("--bg-soft", t.bgSoft);

  s.setProperty("--accent", t.accent);
  s.setProperty("--accent-2", t.accent2);
}

      <p>书中覆盖的关键时代——一本书的跨度，一目了然。</p>
    </div>
    <div class="tl">
      ${b.timeline.map(t => `
        <div class="tl-item">
          <span class="tl-era">${t.era}</span>
          <h3>${t.title}</h3>
          <p>${t.note}</p>
        </div>`).join("")}
    </div>
  </section>`;
}

function praiseHTML(b) {
  return `
  <section class="section" id="praise">
    <div class="section-head">
      <p class="kicker">Why we recommend</p>
      <h2>推荐语</h2>
    </div>
    <div style="max-width:760px;margin:0 auto">
      ${b.praise.map(p => `
        <div class="praise-card">
          <blockquote>「${p.text}」</blockquote>
          <cite>—— ${p.source}</cite>
        </div>`).join("")}
    </div>
  </section>`;
}

function fitHTML(b) {
  return `
  <section class="section" id="fit">
    <div class="section-head">
      <p class="kicker">Is it for you</p>
      <h2>这本书适合谁</h2>
    </div>
    <div class="grid">
      <div class="fit-col fit-for">
        <h3>适合你，如果……</h3>
        <ul>${b.fit.for.map(x => `<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="fit-col not-for">
        <h3>可能不适合，如果……</h3>
        <ul>${b.fit.notFor.map(x => `<li>${x}</li>`).join("")}</ul>
      </div>
    </div>
  </section>`;
}

function relatedHTML(b) {
  return `
  <section class="section" id="related">
    <div class="section-head">
      <p class="kicker">Read next</p>
      <h2>同主题延伸阅读</h2>
      <p>读完这本之后，可以从这三个方向继续深入。</p>
    </div>
    <div class="grid">
      ${b.related.map(r => `
        <div class="card">
          <h3>${r.title}</h3>
          <p><strong style="color:var(--muted);font-weight:400">${r.author}</strong><br>${r.why}</p>
          <p class="rel-actions"><a href="${r.link}" target="_blank" rel="noopener noreferrer">豆瓣搜一下 →</a></p>
        </div>`).join("")}
    </div>
  </section>`;
}

const b = BOOKS[0];
applyTheme(b.theme);
document.getElementById("app").innerHTML =
  heroHTML(b) + sellingHTML(b) + introHTML(b) + authorHTML(b) +
  glimpsesHTML(b) + timelineHTML(b) + praiseHTML(b) + fitHTML(b) + relatedHTML(b);
</script>
</body>
</html>
